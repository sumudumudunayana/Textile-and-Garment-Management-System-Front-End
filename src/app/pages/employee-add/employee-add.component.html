<div class="banner">
  <app-navbar></app-navbar>

  <form #userForm="ngForm" (ngSubmit)="addEmployee(userForm)" novalidate>
    <div class="form">
      <input
        type="text"
        class="form-control"
        name="employeeName"
        [(ngModel)]="employee.employeeName"
        placeholder="Enter Name"
        required
        #nameRef="ngModel"
      />
      <div class="error" *ngIf="nameRef.invalid && nameRef.touched">
        Name is required.
      </div>

      <input
        type="text"
        class="form-control"
        name="employeeAddress"
        [(ngModel)]="employee.employeeAddress"
        placeholder="Enter Address"
        required
        #addrRef="ngModel"
      />
      <div class="error" *ngIf="addrRef.invalid && addrRef.touched">
        Address is required.
      </div>

      <input
        type="email"
        class="form-control"
        name="employeeEmail"
        [(ngModel)]="employee.employeeEmail"
        placeholder="Enter Email"
        required
        pattern="^[^\s@]+@[^\s@]+\.[^\s@]{2,}$"
        #emailRef="ngModel"
      />
      <div class="error" *ngIf="emailRef.invalid && emailRef.touched">
        <span *ngIf="emailRef.errors?.['required']">Email is required.</span>
        <span *ngIf="emailRef.errors?.['pattern']"
          >Enter a valid email address.</span
        >
      </div>

      <input
        type="tel"
        class="form-control"
        name="employeePhoneNumber"
        [(ngModel)]="employee.employeePhoneNumber"
        placeholder="Enter Phone Number (07XXXXXXXX)"
        required
        pattern="^0[0-9]{9}$"
        minlength="10"
        maxlength="10"
        #phoneRef="ngModel"
      />
      <div class="error" *ngIf="phoneRef.invalid && phoneRef.touched">
        <span *ngIf="phoneRef.errors?.['required']">Phone number is required.</span>
        <span *ngIf="phoneRef.errors?.['pattern']">Must start with 0 and be 10 digits (e.g., 07XXXXXXXX).
        </span>
      </div>

      <button
        type="submit"
        class="btn btn-primary"
        [disabled]="userForm.invalid"
      >
        Add Employee
      </button>
    </div>
  </form>
</div>
