<div class="banner">
  <app-navbar></app-navbar>

  <div class="wrap">
    <form class="customer" #custForm="ngForm">
      <div class="customer-inputs">
        <!-- Customer selector -->
        <div class="input-group">
          <label for="customerSelect">Customer</label>
          <select
            id="customerSelect"
            name="customerSelect"
            class="form-select"
            [(ngModel)]="selectedCustomerId"
            (ngModelChange)="onCustomerChange()"
            required
          >
            <option [ngValue]="null" disabled selected>
              {{ customersLoading ? "Loading customers…" : "Select customer" }}
            </option>
            <option *ngFor="let c of customers" [ngValue]="c.id">
              {{ c.id }} — {{ c.customerFirstName }} {{ c.customerLastName }}
            </option>
          </select>
          <small *ngIf="customersError" class="text-danger">{{
            customersError
          }}</small>
        </div>
      </div>

      <div class="customer__info" *ngIf="customerId || customerName">
        <span>Selected Customer : </span>
        <strong>{{ customerId || "—" }}</strong>
        <span>• </span>
        <strong>{{ customerName || "—" }}</strong>
      </div>
    </form>

    <header class="head">
      <h2>Ready-Made Items</h2>

      <a routerLink="/shopping-cart" class="cart-pill" title="Open cart">
        🛒 <span>{{ cartCount }}</span>
      </a>
    </header>

    <div class="grid">
      <div class="card" *ngFor="let p of products">
        <div class="card__image" *ngIf="p.imageUrl">
          <img [src]="p.imageUrl" [alt]="p.name" />
        </div>

        <div class="card__body">
          <h3 class="card__title">{{ p.name }}</h3>
          <div class="card__price">LKR {{ p.price | number : "1.0-0" }}</div>

          <div class="qty">
            <button type="button" (click)="dec(p)">−</button>
            <input type="number" min="1" [(ngModel)]="qtyMap[p.id]" />
            <button type="button" (click)="inc(p)">+</button>
          </div>

          <button class="btn-add" (click)="addToCart(p)">Add to Cart</button>
        </div>
      </div>
    </div>
  </div>
</div>
